<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2026"/>
      <stop offset="100%" stop-color="#0a0c0e"/>
    </linearGradient>
    <!-- Primary Amber / Flame Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd38d"/>
      <stop offset="40%" stop-color="#f2a93b"/>
      <stop offset="100%" stop-color="#c1440e"/>
    </linearGradient>
    <!-- Accent Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c1440e"/>
      <stop offset="60%" stop-color="#e05e1b"/>
      <stop offset="100%" stop-color="#f2a93b"/>
    </linearGradient>
    <!-- Outer Rim Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2a93b"/>
      <stop offset="50%" stop-color="#c1440e"/>
      <stop offset="100%" stop-color="#383e48"/>
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Hexagonal / Automotive Crest Shield -->
  <path d="M24 3 L42 10.5 L42 27 C42 36.5 34.5 42.8 24 45.5 C13.5 42.8 6 36.5 6 27 L6 10.5 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#rimGrad)" 
        stroke-width="2" 
        stroke-linejoin="round"/>

  <!-- Inner Recessed Shield Line -->
  <path d="M24 6 L39 12.5 L39 26.5 C39 34.2 32.8 39.6 24 42.2 C15.2 39.6 9 34.2 9 26.5 L9 12.5 Z" 
        fill="none" 
        stroke="rgba(242, 169, 59, 0.2)" 
        stroke-width="1" 
        stroke-linejoin="round"/>

  <!-- Stylized Automotive "ST" Dynamic Wing / Turbo Speed Curve -->
  <!-- Upper Wing / S top -->
  <path d="M16 16.5 C20 14 30 14 33 17 C35 19 34 22 30 23.5 L21 27 C17.5 28.5 16 31 18 33.5 C20.5 36.5 28 36.5 32 34 L31 36.5 C26.5 39 17.5 39 14.5 35.5 C12 32.5 13.5 28.5 18 26.5 L27 23 C30.5 21.5 31.5 19 29.5 17.5 C27 15.5 19.5 15.5 15.5 18 Z" 
        fill="url(#amberGrad)" 
        filter="url(#glow)"/>

  <!-- Central Speed Bar / Crosswing (Piston & Track Motif) -->
  <path d="M11 23.5 L37 23.5" 
        stroke="url(#flameGrad)" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        opacity="0.85"/>

  <!-- Dynamic Precision T-Bar Accents -->
  <circle cx="24" cy="11.5" r="1.5" fill="#f2a93b"/>
  <circle cx="24" cy="39" r="1.2" fill="#c1440e"/>
</svg>
